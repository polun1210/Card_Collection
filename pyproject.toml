[project]
name = "card-collection"
version = "0.1.0"
description = "個人使用的寶可夢 PSA 10 鑑定卡追蹤儀表板"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "pillow>=12.3.0",
    "curl-cffi>=0.16.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/card_collection"]

[tool.pytest.ini_options]
testpaths = ["tests"]
